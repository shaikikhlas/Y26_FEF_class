<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <h2>Html table tag example</h2>
    <table border="1">
                <caption> Student Marks</caption>
                <colgroup>
                    <col style="background-color: lightblue;">
                    <col style="background-color: lightpink;">
                    <col style="background-color: lightgreen">
                </colgroup>
                <thead>
                <tr>
                    <th>Student Name</th>
                    <th>subjects</th>
                    <th>marks</th>
                </tr>
                    </thead>
                    <tbody>
                <tr>
                <td rowspan="2" style="padding: 20px;">Harshith </td>
                <td>HTML</td>
                <td>90</td>
                    </tr>
                    <tr>
                <td>CSS</td>
                <td>88</td>
                    </tr>
                     <tr>
                <td rowspan="2">sahil</td>
                <td>HTML</td>
                <td>85</td>
                    </tr>
                    <tr>
                <td>CSS</td>
                <td>90</td>
                    </tr>
                    </tbody>
                    <tfoot>
                    <tr>
                <th colspan="2">Total students</th>
                <td>2</td>
                    </tr>
                    </tfoot>
    </table>
</body>
</html>
