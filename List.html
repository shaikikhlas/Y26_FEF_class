<html>
	<head>
		<title>HTML LISTS</title>
	</head>
	<body>
<!-- Ordered list -->
###Ordered list###
		<ol type="1" start="3" reversed>
			<li>HTML</li>
			<li>CSS</li>
			<li>JS</li>
		</ol>
<!-- UnOrdered list -->	
###UnOrdered list###
		<ul style="list-style-type:none;">
			<li>HTML</li>
			<li>CSS</li>
			<li>JS</li>
		</ul>
<!-- Description list -->	
###Description list###
		<dl>
			<dt>HTML</dt>
			<dd> Hyper Text Markup Language</dd>
			<dt>CSS</dt>
			<dd> Cascading style Sheet</dd>
			<dt>JS</dt>
			<dd> Java Script</dd>
		</dl>

	</body>
<!--Nested list-->
###Nested list###
		<ul>
			<li>Frontend
				<ol>
					<li>HTML</li>
					<li>CSS</li>
					<li>JS</li>	
				</ol>
			</li>

			<li>Backend
				<ol>
					<li>Java</li>
				</ol>
			</li>
		</ul>
</html>
